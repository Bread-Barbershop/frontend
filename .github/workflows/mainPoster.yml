# 워크플로우 이름 (GitHub Actions 탭에 표시됨)
name: mainPoster PR -> Discord Notify

# 언제 실행할지(트리거) 정의
on:
  pull_request:
    # PR "생성(opened)" 이벤트에서만 실행
    types: [opened, reopened]
    # PR의 base(대상) 브랜치가 아래일 때만 실행
    branches:
      - feat/mainPoster/base

# 최소 권한 원칙(필요한 읽기 권한만 부여)
permissions:
  pull-requests: read
  contents: read

jobs:
  notify-discord:
    # Draft PR은 알림 제외(원하면 이 줄 삭제)
    if: ${{ !github.event.pull_request.draft }}

    # 실행 환경
    runs-on: ubuntu-latest

    steps:
      # Discord로 보낼 JSON(payload) 생성
      - name: Build Discord payload
        id: payload
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const from = pr.head.ref;
            const to = pr.base.ref;
            const author = pr.user.login;

            const payload = {
              username: "📮mainPoster 알림봇",
              content: "mainPoster에 새로운 PR이 도착했어요!",
              embeds: [
                {
                  title: `🧡 PR #${pr.number} · ${pr.title}`,
                  url: pr.html_url,
                  color: 16761035,
                  description:
                    `🌿 **From**: \`${from}\` ➡️ **To**: \`${to}\`\n` +
                    `🐣 **Author**: **${author}**\n`,
                }
              ]
            };

            core.setOutput("json", JSON.stringify(payload));

      # Discord Webhook으로 실제 전송
      - name: Send to Discord
        env:
          DISCORD_WEBHOOK_POSTER: ${{ secrets.DISCORD_WEBHOOK_POSTER }}
          # 위 step에서 만든 JSON 문자열
          PAYLOAD: ${{ steps.payload.outputs.json }}
        run: |
          # 시크릿이 없으면 실패 처리
          if [ -z "$DISCORD_WEBHOOK_POSTER" ]; then
            echo "Missing DISCORD_WEBHOOK_POSTER secret"
            exit 1
          fi

          # Discord Webhook으로 POST 요청
          curl -sSf -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_POSTER"
