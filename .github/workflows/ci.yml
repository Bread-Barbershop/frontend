name: Frontend CI Gate

on:
  pull_request:
    branches: [dev, main]
  merge_group:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  gate:
    name: Frontend Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. main 직행 방지: 오직 dev 브랜치에서 온 PR만 main으로 머지 허용
      - name: Enforce Source Branch for Main
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref != 'dev'
        run: |
          echo "❌ [오류] main 브랜치로는 직접 PR을 보낼 수 없습니다!"
          echo "팀 원칙상 모든 기능은 'dev'를 거쳐야 하며, 오직 'dev' 브랜치에서만 main으로 머지될 수 있습니다."
          echo "현재 시도한 출발 브랜치: ${{ github.head_ref }}"
          exit 1

      # 2. Node.js 환경 세팅 및 npm 캐시
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. 의존성 클린 설치
      - name: Install dependencies
        run: npm ci

      # 4. ESLint 코드 스타일 및 안티패턴 검사
      - name: Run ESLint
        run: npm run lint

      # 5. Next.js 빌드 캐시 복원
      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      # 6. 프로덕션 빌드 및 TypeScript 전체 검증 (next build 내부에 TS 검사 포함)
      - name: Build Next.js & Type Check
        run: npm run build

      # 7. Jest 단위/통합 테스트: 하나라도 실패하면 CI 실패 처리
      - name: Run Jest Tests
        run: npm test -- --ci --maxWorkers=2

      # 8. CI 실패 시 디스코드 알림 전송 (github-script로 안전한 JSON 직렬화)
      - name: Discord Notification on Failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_MAIN: ${{ secrets.DISCORD_WEBHOOK_MAIN }}
        with:
          script: |
            const webhookUrl = process.env.DISCORD_WEBHOOK_MAIN;
            if (!webhookUrl) {
              console.log('DISCORD_WEBHOOK_MAIN secret not found, skipping notification.');
              return;
            }

            const pr = context.payload.pull_request;
            if (!pr) return;

            const target = pr.base ? pr.base.ref : 'unknown';
            const author = pr.user ? pr.user.login : context.actor;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const payload = {
              username: "🚨 Frontend CI 알림봇",
              content: `<@${author}> 님의 PR CI 검증이 실패했습니다! (대상: \`${target}\`)`,
              embeds: [{
                title: `❌ Frontend CI 실패: PR #${pr.number} · ${pr.title}`,
                url: pr.html_url,
                color: 15158332,
                fields: [
                  { name: "작업자", value: author, inline: true },
                  { name: "대상 브랜치", value: `\`${target}\``, inline: true },
                  { name: "실행 로그", value: `[GitHub Actions 로그 보기](${runUrl})`, inline: false }
                ]
              }]
            };

            await fetch(webhookUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
