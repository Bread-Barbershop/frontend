name: main PR -> Discord Notify

on:
  pull_request:
    types: [opened, reopened]
    branches:
      - main

permissions:
  pull-requests: read
  contents: read

jobs:
  notify-discord:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    steps:
      - name: Build Discord payload
        id: payload
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            const from = pr.head.ref;
            const to = pr.base.ref;
            const author = pr.user.login;

            // Discord embed limits:
            // - field value: 1024 chars (safe to truncate to 1000~1024)
            const truncate = (text = '', max = 1024) => {
              const t = String(text ?? '').trim();
              if (!t) return '—';
              return t.length > max ? `${t.slice(0, max - 1)}…` : t;
            };

            const prLink = pr.html_url;
            const prBody = truncate(pr.body, 1024);

            const payload = {
              username: "🧚main 알림봇",
              content: `\`${to}\`에 ${author}님이 PR을 등록했어요!`,
              embeds: [
                {
                  title: `🧡 PR #${pr.number} · ${pr.title}`,
                  url: prLink,
                  color: 16761035,
                  fields: [
                    {
                      name: "브랜치",
                      value: `From \`${from}\` → To \`${to}\``,
                      inline: false
                    },
                    {
                      name: "Author",
                      value: `**${author}**`,
                      inline: true
                    },
                    {
                      name: "PR 링크",
                      value: `[바로가기](${prLink})`,
                      inline: true
                    },
                    {
                      name: "PR 내용",
                      value: prBody,
                      inline: false
                    }
                  ]
                }
              ]
            };

            core.setOutput("json", JSON.stringify(payload));

      - name: Send to Discord
        env:
          DISCORD_WEBHOOK_MAIN: ${{ secrets.DISCORD_WEBHOOK_MAIN }}
          PAYLOAD: ${{ steps.payload.outputs.json }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_MAIN" ]; then
            echo "Missing DISCORD_WEBHOOK_MAIN secret"
            exit 1
          fi

          curl -sSf -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_MAIN"
